<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Social Command</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%230C0C0D%22/%3E%3Ctext x=%2216%22 y=%2221%22 font-family=%22monospace%22 font-size=%2214%22 fill=%22%23F7F7F5%22 text-anchor=%22middle%22%3Efl%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
/* Layout: slim left rail, command bar, one working canvas per view. Monochrome graphite: ink on paper in light, paper on ink in dark. Status lives in small dots and shapes, never in fills. */
:root{
 --bg:#F5F5F4;--surface:#FFFFFF;--raised:#FAFAF9;--sunk:#EDEDEB;
 --ink:#0C0C0D;--ink2:#56565C;--ink3:#8D8D93;--line:rgba(12,12,13,.08);--line2:rgba(12,12,13,.16);
 --inv:#0C0C0D;--invfg:#F7F7F5;--glow:rgba(12,12,13,.06);
 --ok:#3F8F67;--warn:#B07A1E;--bad:#B4453C;
 --f-display:"Instrument Serif","Iowan Old Style","Times New Roman",serif;
 --f-body:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
 --f-mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
 --ease:cubic-bezier(.16,1,.3,1);--r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#09090A;--surface:#111113;--raised:#161618;--sunk:#0D0D0E;
 --ink:#F2F2EF;--ink2:#A3A3A9;--ink3:#6B6B72;--line:rgba(242,242,239,.08);--line2:rgba(242,242,239,.16);
 --inv:#F2F2EF;--invfg:#0C0C0D;--glow:rgba(242,242,239,.06);--ok:#6CC596;--warn:#E0AE55;--bad:#E07A70;color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#09090A;--surface:#111113;--raised:#161618;--sunk:#0D0D0E;
 --ink:#F2F2EF;--ink2:#A3A3A9;--ink3:#6B6B72;--line:rgba(242,242,239,.08);--line2:rgba(242,242,239,.16);
 --inv:#F2F2EF;--invfg:#0C0C0D;--glow:rgba(242,242,239,.06);--ok:#6CC596;--warn:#E0AE55;--bad:#E07A70;color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:400 14px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
button,input,textarea,select{font:inherit;color:inherit}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.02em;text-wrap:balance}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}
a{color:inherit;text-decoration-color:var(--line2);text-underline-offset:3px}
a:hover{text-decoration-color:var(--ink)}

.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:28px;padding-block:22px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:14px;border-right:1px solid var(--line);background:var(--bg);z-index:5}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.mark{width:28px;height:28px;border-radius:8px;background:var(--inv);color:var(--invfg);display:grid;place-items:center;font:600 13px var(--f-mono)}
.brand b{font-weight:600;letter-spacing:-.02em}.brand small{display:block;color:var(--ink3);font-size:11.5px;letter-spacing:.02em}
.nav{display:grid;gap:2px;position:relative}
.nav a{position:relative;display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:10px;color:var(--ink2);text-decoration:none;font-weight:500;z-index:1;transition:color .25s var(--ease)}
.nav a:hover{color:var(--ink)}
.nav a[aria-current="page"]{color:var(--ink)}
.nav svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav .count{margin-left:auto;font:500 11px var(--f-mono);min-width:20px;height:20px;border-radius:99px;display:grid;place-items:center;background:var(--inv);color:var(--invfg);padding:0 6px}
.nav .count:empty{display:none}
.nav-ind{position:absolute;left:0;right:0;height:38px;border-radius:10px;background:var(--surface);border:1px solid var(--line);box-shadow:0 1px 2px var(--glow);transition:transform .45s var(--ease);z-index:0}
.rail-foot{margin-top:auto;display:grid;gap:10px;padding:0 6px}
.live{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2)}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--ok);position:relative;flex:none}
.pulse::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1.5px solid var(--ok);animation:ping 2.2s var(--ease) infinite}
.pulse.off{background:var(--ink3)}.pulse.off::after{display:none}
@keyframes ping{0%{transform:scale(.5);opacity:.9}100%{transform:scale(1.8);opacity:0}}
.ghost{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:8px 12px;border-radius:10px;border:1px solid var(--line2);background:transparent;cursor:pointer;font-weight:500;font-size:13px;transition:background .2s,border-color .2s,transform .2s var(--ease)}
.ghost:hover{background:var(--surface);border-color:var(--ink3)}
.ghost:active{transform:scale(.97)}
.ghost svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.main{min-width:0;padding-block:20px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1280px;margin:0 auto;padding:0 12px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:6px 0 26px}
.crumbs{font:500 12px var(--f-mono);color:var(--ink3);letter-spacing:.02em;text-transform:uppercase}
.bar-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chipline{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border-radius:99px;border:1px solid var(--line);font-size:12px;color:var(--ink2);background:var(--surface)}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:28px}
.hero h1{font:400 clamp(38px,5vw,60px)/1 var(--f-display);letter-spacing:-.02em}
.hero h1 em{font-style:italic;color:var(--ink2)}
.hero p{margin:10px 0 0;color:var(--ink2);max-width:60ch;font-size:15px}

.view{animation:viewIn .6s var(--ease) both}
@keyframes viewIn{from{opacity:0;transform:translateY(10px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
.rise{animation:rise .7s var(--ease) both;animation-delay:calc(var(--i,0)*55ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
::view-transition-old(root){animation:vtOut .28s var(--ease) both}
::view-transition-new(root){animation:vtIn .5s var(--ease) both}
@keyframes vtOut{to{opacity:0;transform:translateY(-6px)}}
@keyframes vtIn{from{opacity:0;transform:translateY(8px)}}

.panel{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0;transition:border-color .3s var(--ease),transform .4s var(--ease),box-shadow .4s var(--ease);overflow:hidden}
.panel.spot::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(420px circle at var(--mx,-999px) var(--my,-999px),var(--glow),transparent 45%);transition:opacity .3s;opacity:0}
.panel.spot:hover::before{opacity:1}
.panel.lift:hover{border-color:var(--line2);transform:translateY(-2px);box-shadow:0 12px 30px -18px rgba(0,0,0,.25)}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.ph h3{font-size:15px;font-weight:600}
.ph small,.muted{color:var(--ink3);font-size:12.5px}
.label{font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.g{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,1.65fr) minmax(0,1fr)}
.mb{margin-bottom:14px}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g21{grid-template-columns:1fr}}
@media(max-width:640px){.g4,.g3,.g2{grid-template-columns:1fr}}

.kpi .v{font:400 54px/1 var(--f-display);letter-spacing:-.02em;margin:14px 0 6px}
.kpi .d{display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--ink2);font-size:12.5px}
.kpi.tile{display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
.kpi.tile .label::after{content:" →";opacity:0;transition:opacity .2s}
.kpi.tile:hover .label::after,.kpi.tile:focus-visible .label::after{opacity:.7}
.kpi.tile:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.spark{display:block;overflow:visible}
.spark path.l{fill:none;stroke:var(--ink);stroke-width:1.5}
.spark path.a{fill:var(--glow)}
.draw{stroke-dasharray:var(--len,1000);stroke-dashoffset:var(--len,1000);animation:draw 1.4s var(--ease) .2s forwards}
@keyframes draw{to{stroke-dashoffset:0}}

.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none;background:var(--ink3)}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}.dot.ring{background:transparent;border:1.5px solid var(--ink2)}.dot.ink{background:var(--ink)}
.tag{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:99px;border:1px solid var(--line2);font-size:12px;font-weight:500;color:var(--ink2);white-space:nowrap;background:var(--surface)}
.tag.solid{background:var(--inv);color:var(--invfg);border-color:transparent}

.acct{display:flex;flex-direction:column;gap:12px}
.acct .top{display:flex;align-items:center;gap:12px}
.glyph{width:36px;height:36px;border-radius:10px;border:1px solid var(--line2);display:grid;place-items:center;flex:none;background:var(--raised)}
.glyph svg{width:17px;height:17px;fill:var(--ink)}
.acct .nm{font-weight:600;line-height:1.2}.acct .sub{font-size:12px;color:var(--ink3)}
.acct .row{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.acct .big{font:400 36px/1 var(--f-display)}

.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{font:500 10.5px var(--f-mono);fill:var(--ink3)}
.bars rect{transform-origin:bottom;transform-box:fill-box;animation:grow .9s var(--ease) both}
@keyframes grow{from{transform:scaleY(0)}}
.tip{position:fixed;pointer-events:none;z-index:50;background:var(--inv);color:var(--invfg);font:500 12px var(--f-mono);padding:8px 10px;border-radius:8px;opacity:0;transform:translateY(4px);transition:opacity .15s,transform .2s var(--ease);white-space:nowrap}
.tip.on{opacity:1;transform:none}

.list{display:grid}
.li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .t{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .s{font-size:12.5px;color:var(--ink3)}
.thumbmini{width:40px;height:40px;border-radius:8px;object-fit:cover;background:var(--sunk);border:1px solid var(--line)}
.empty{padding:40px 20px;text-align:center;color:var(--ink3);border:1px dashed var(--line2);border-radius:var(--r)}
.skel{background:linear-gradient(90deg,var(--sunk),var(--raised),var(--sunk));background-size:200% 100%;animation:sh 1.4s linear infinite;border-radius:8px}
@keyframes sh{to{background-position:-200% 0}}
/* Studio */
.studio{display:grid;grid-template-columns:280px minmax(0,1fr);gap:14px;align-items:start}
.studio>*,#editor,.editor>*,.field{min-width:0}
.qlist{min-width:0}.qlist .seg{overflow-x:auto}
@media(max-width:1100px){.studio{grid-template-columns:1fr}}
.qlist{display:grid;gap:8px;position:sticky;top:20px}
.qtabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
.qi{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:center;text-align:left;width:100%;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;transition:border-color .25s,transform .35s var(--ease),background .25s}
.qi:hover{border-color:var(--line2);transform:translateX(2px)}
.qi[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.qi img{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--sunk)}
.qi b{display:block;font-weight:500;font-size:13px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.qi span{font-size:11.5px;color:var(--ink3);display:flex;align-items:center;gap:6px;margin-top:3px}
.editor{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:14px;align-items:start}
@media(max-width:1280px){.editor{grid-template-columns:1fr}.stage{position:static}}
.stage{position:sticky;top:20px;display:grid;gap:12px}
.frame-wrap{display:grid;place-items:center;height:520px;background:var(--sunk);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;position:relative}
.frame-wrap::after{content:"";position:absolute;inset:0;background-image:radial-gradient(var(--line2) 1px,transparent 1px);background-size:16px 16px;opacity:.5;pointer-events:none}
.frame{position:relative;z-index:1;border-radius:12px;overflow:hidden;background:#000;box-shadow:0 24px 50px -20px rgba(0,0,0,.45),0 0 0 1px var(--line2);transition:width .7s var(--ease),height .7s var(--ease)}
.frame img,.frame video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .45s var(--ease)}
.frame .fade{opacity:0}
.frame .badge{position:absolute;left:10px;top:10px;z-index:2;font:500 10.5px var(--f-mono);letter-spacing:.06em;background:rgba(0,0,0,.6);color:#fff;padding:4px 7px;border-radius:6px;backdrop-filter:blur(6px)}
@media(max-width:640px){.frame-wrap{height:420px}}
.seg{position:relative;display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:3px;border-radius:11px;background:var(--sunk);border:1px solid var(--line)}
.seg button{position:relative;z-index:1;border:0;background:transparent;padding:7px 12px;border-radius:8px;font-weight:500;font-size:12.5px;color:var(--ink2);cursor:pointer;transition:color .25s;white-space:nowrap}
.seg button[aria-pressed="true"]{color:var(--ink)}
.seg .th{position:absolute;z-index:0;top:3px;bottom:3px;border-radius:8px;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 1px var(--line);transition:left .45s var(--ease),width .45s var(--ease)}
.seg.full{display:grid;width:100%}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.thumbs button{position:relative;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--sunk);cursor:pointer;aspect-ratio:1;transition:transform .35s var(--ease),border-color .2s}
.thumbs button:hover{transform:translateY(-2px)}
.thumbs button[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs span{position:absolute;left:6px;bottom:6px;font:500 10px var(--f-mono);background:rgba(0,0,0,.65);color:#fff;padding:2px 6px;border-radius:5px}
.sect{display:grid;gap:10px;padding:18px 0;border-top:1px solid var(--line)}
.sect:first-of-type{border-top:0;padding-top:4px}
.sect .lh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.targets{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
@media(max-width:640px){.targets{grid-template-columns:1fr}}
.tg{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--raised);cursor:pointer;text-align:left;transition:border-color .25s,background .25s}
.tg:hover{border-color:var(--line2)}
.tg[aria-checked="true"]{border-color:var(--ink);background:var(--surface)}
.tg b{font-weight:500;font-size:13px;display:block;line-height:1.2}.tg small{font-size:11.5px;color:var(--ink3)}
.sw{width:34px;height:20px;border-radius:99px;background:var(--line2);position:relative;transition:background .3s var(--ease);flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .35s var(--ease)}
[aria-checked="true"] .sw{background:var(--ink)}
[aria-checked="true"] .sw::after{transform:translateX(14px)}
.fit{display:flex;gap:6px;flex-wrap:wrap}
.fit .tag.warnt{border-color:var(--warn);color:var(--warn)}
.field{display:grid;gap:6px}
.field input,.field textarea{width:100%;border:1px solid var(--line2);background:var(--raised);border-radius:10px;padding:10px 12px;transition:border-color .2s,background .2s;resize:vertical}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--ink);background:var(--surface)}
.field textarea{min-height:150px;line-height:1.55}
.cc{font:500 11px var(--f-mono);color:var(--ink3);text-align:right}.cc.over{color:var(--bad)}
.ctabs{display:flex;gap:4px;flex-wrap:wrap}
.ctabs button{border:1px solid var(--line);background:transparent;border-radius:8px;padding:5px 10px;font-size:12px;font-weight:500;color:var(--ink2);cursor:pointer;transition:all .2s}
.ctabs button[aria-pressed="true"]{background:var(--inv);color:var(--invfg);border-color:transparent}
.actbar{position:sticky;bottom:12px;z-index:3;display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:10px;border-radius:14px;border:1px solid var(--line2);background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);margin-top:8px}
.actbar .l{display:flex;align-items:center;gap:8px;color:var(--ink2);font-size:12.5px;min-width:0}
.actbar .r{display:flex;gap:6px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);font-weight:500;font-size:13px;cursor:pointer;transition:transform .2s var(--ease),background .2s,border-color .2s,opacity .2s}
.btn:hover{border-color:var(--ink3)}.btn:active{transform:scale(.97)}
.btn.pri{background:var(--inv);color:var(--invfg);border-color:transparent}
.btn.bad{color:var(--bad)}
.strip{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:2px}.si{position:relative;flex:0 0 64px;height:64px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--sunk)}.si img,.si video{width:100%;height:100%;object-fit:cover;display:block}.si span{position:absolute;left:5px;top:3px;font:600 11px var(--f-mono);color:#fff;text-shadow:0 1px 3px #000}.si button{position:absolute;right:3px;top:3px;width:18px;height:18px;padding:0;border:0;border-radius:6px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;line-height:18px;cursor:pointer}
.cut{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);display:grid;gap:10px;font-size:13px}
.cut .bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}.cut .bar i{display:block;height:100%;background:var(--ink);transition:width .3s}
.btn.pri:hover{opacity:.9}
.btn:disabled{opacity:.4;cursor:not-allowed}
.hist{display:grid;gap:0;margin:0;padding:0;list-style:none}
.hist li{display:grid;grid-template-columns:14px minmax(0,1fr);gap:10px;padding:6px 0;font-size:12.5px;color:var(--ink2);position:relative}
.hist li::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ink3);margin-top:6px}
.hist li:not(:last-child)::after{content:"";position:absolute;left:3px;top:18px;bottom:-6px;width:1px;background:var(--line2)}

(async()=>{try{db=await claude.use('db');user=await claude.use('user')}catch(e){}
 if(!db){$('#livetxt').textContent='Offline view';return}
 try{S.me=user?await user.id():null}catch(e){}
 $('#pulse').classList.remove('off');$('#livetxt').textContent='Live';
 const on=(ref,f)=>ref.onSnapshot(s=>{f(s);soft()},()=>{});
 on(db.collection('accounts'),s=>{S.accounts={};s.docs.forEach(d=>S.accounts[d.id]=d.data())});
 on(db.collection('queue'),async s=>{S.queue=s.docs.map(d=>({id:d.id,...d.data()}));const ids=[...new Set(S.queue.flatMap(q=>(q.history||[]).map(h=>h.by)).filter(x=>x&&!['claude','server','team'].includes(x)&&!S.names[x]))];if(ids.length&&user&&user.profiles){try{const ps=await user.profiles(ids);ids.forEach(i=>S.names[i]=(ps[i]&&ps[i].name)||'Someone');soft()}catch(e){}}});
 on(db.doc('sync/latest'),d=>{const prev=S.sync&&S.sync.synced_at;S.sync=d.exists?d.data():null;const now=S.sync&&S.sync.synced_at;if(prev&&now&&now!==prev)toast('Numbers updated · synced at '+ftime(now)+'.')});
 on(db.doc('insights/latest'),d=>{S.insights=d.exists?d.data():null});
 on(db.doc('config/needs'),d=>{S.needs=d.exists?(d.data().items||[]):[]});
 on(db.doc('requests/refresh'),d=>{S.req=d.exists?d.data():null});
 on(db.doc('sync/heartbeat'),d=>{S.hb=d.exists?d.data():null});
 on(db.collection('runs'),s=>{S.runs=s.docs.map(d=>d.data())});
 on(db.collection('snapshots'),s=>{S.snaps=s.docs.map(d=>({d:d.id,...d.data()}))});
 setInterval(liveBits,60000);
})();
})();
</script>

</body></html>
